services:
  - type: web
    name: nirakar-education-society
    env: node
    plan: standard
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma && node apps/api/dist/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_BASE_PATH
        value: /admin
      - key: DATABASE_URL
        fromDatabase:
          name: nirakar-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: nirakar-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /opt/render/project/src/storage/uploads
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
    disk:
      name: nirakar-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 10

databases:
  - name: nirakar-db
    plan: standard
    postgresMajorVersion: 16
