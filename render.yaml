services:
  - type: web
    name: nirakar-education-society
    env: node
    plan: standard
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma && node apps/api/dist/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_BASE_PATH
        value: /admin
      - key: DATABASE_URL
        fromDatabase:
          name: nirakar-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true

databases:
  - name: nirakar-db
    plan: standard
    postgresMajorVersion: 16
