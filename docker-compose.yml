version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nirakar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nirakar
    ports:
      - "5432:5432"
    volumes:
      - nirakar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nirakar-db-data:
    driver: local
